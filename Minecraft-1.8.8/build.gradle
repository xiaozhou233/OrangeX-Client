plugins {
    id 'java'
}

group = 'cn.xiaozhou233.orangex.injector'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation fileTree(dir: "../Minecraft-1.8.8-runtime/libraries", include: ["**/*.jar"])
    implementation files("../Minecraft-1.8.8-runtime/versions/1.8.8/1.8.8.jar")

    implementation files("../libraries/JuiceAgent-API-1.4.1+build.1.jar")

    implementation project(":OrangeX")
}

test {
    useJUnitPlatform()
}